# Starter rules, copied into the DB on first run (then edit them in the app).
# field: merchant (normalised name) | description | party | type (descriptor type) | counterparty
# pattern: case-insensitive regex (search). sign: -1 out / 1 in. First match wins (top to bottom).

# --- by descriptor type (generic fallbacks are at the bottom) ---
- {field: type, pattern: '^salary$', account_kind: meal, category: Meal allowance}
- {field: type, pattern: '^salary$', category: Salary}
- {field: type, pattern: '^interest$', category: Interest}
- {field: description, pattern: 'IMPOSTO (DO )?SELO', category: Fees & taxes > Stamp duty}
- {field: description, pattern: 'CUSTO DE SERVICO INTERNACIONAL|COM\.?LEVANTAMENTO|COMISSAO LEVANTAMENTO', category: Fees & taxes > FX & card fees}
- {field: type, pattern: '^fee$', category: Fees & taxes > Bank fees}
- {field: type, pattern: '^atm$', category: Cash > ATM withdrawal}
- {field: type, pattern: '^fx$', category: Travel > Currency exchange}
- {field: description, pattern: 'REEMBOLSOS\s+IRS|AT - REEM', category: Tax refund}

